  .yourrate-card {

  .review-stars { display: flex; align-items: center; gap: 3px; margin-left: auto; }

  .review-text { font-size: 13px; line-height: 1.65; color: #c9c9c4; }

  .review-form-wrap {

    opacity: 1;
  }
  .review-form {
    margin: 8px 16px 20px;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    background: #101010;
    padding: 14px 16px;
  }
  .review-form h3 { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: #f5f5f2; }
  .review-form .field { margin-bottom: 10px; }
  .review-form label { font-size: 11px; color: #9a9a95; display: block; margin-bottom: 4px; font-weight: 600; }
  .review-form input[type="text"],
  .review-form textarea {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 9px 12px;
    color: #f5f5f2;

  .review-form .row { display: flex; gap: 10px; align-items: center; }

  .review-rating-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    background: rgba(242,201,76,0.08);

    color: #c9c9c4;

  .review-submit {

    font-weight: 700;

  .video-modal {

    { name: "Cast Two",   cls: "p2" },
    { name: "Cast Three", cls: "p3" },
    { name: "Cast Four",  cls: "p4" }
  ];

  function starSVG(filled) {
    return filled
      ? '<svg viewBox="0 0 24 24" class="star-filled"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/></svg>';
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  const starsWrap = document.getElementById('yourRateStars');
  const statusEl = document.getElementById('yourRateStatus');
  const scoreNumEl = document.getElementById('scoreNum');
  const scoreCountEl = document.getElementById('scoreCount');
  const saveBtn = document.getElementById('saveBtn');
  const addListBtn = document.getElementById('addListBtn');
  const reviewFormWrap = document.getElementById('reviewFormWrap');
  const reviewSection = document.getElementById('reviewSection');
  const reviewList = document.getElementById('reviewList');
  const reviewForm = document.getElementById('reviewForm');
  const reviewNameInput = document.getElementById('reviewName');
  const reviewTextInput = document.getElementById('reviewText');
  const reviewRatingValue = document.getElementById('reviewRatingValue');
  const reviewFormMsg = document.getElementById('reviewFormMsg');
  const reviewSubmit = document.getElementById('reviewSubmit');
  const similarScroll = document.getElementById('similarScroll');

  async function loadTitle() {
    if (!supabaseClient) return;
    try {
      const { data, error } = await supabaseClient
        .from('titles')
        .select('*')
        .eq('title', TITLE_NAME)
        .maybeSingle();
      if (error) throw error;
      if (!data) {
        console.warn('Title not found:', TITLE_NAME);
        document.getElementById('titleName').textContent = TITLE_NAME;
        document.getElementById('titleFacts').textContent = 'Not found in database';
        return;
      }

      T.title          = data.title || TITLE_NAME;
      T.genre          = data.genre || '';
      T.type           = data.type || '';
      T.year           = data.year || '';
      T.rating         = Number(data.rating) || 0;
      T.votes          = data.votes || 500;
      T.poster         = data.poster || (data.poster_num != null ? 'poster' + data.poster_num + '.png' : 'LIT.png');
      T.runtime        = data.runtime || '';
      T.contentRating  = data.content_rating || '';
      T.tag            = data.tag || '';
      T.synopsis       = data.synopsis || '';
      T.director       = data.director || '';
      T.writers        = data.writers || '';
      T.cast           = CAST;

      BASE_SCORE = T.rating;
      BASE_VOTES = T.votes;

      renderHero();
    } catch (e) {
      console.warn('Load title failed:', e);
    }
  }

  function renderHero() {
    document.title = T.title + ' — CHROMA';

    const posterEl = document.getElementById('posterLg');
    posterEl.innerHTML = '<img src="' + escapeHtml(T.poster) + '" alt="' + escapeHtml(T.title) + '" ' +
      'onerror="this.style.display=\'none\';">';

    document.getElementById('kickerTag').textContent = T.tag || '';
    document.getElementById('titleName').textContent = T.title;

    const facts = [T.year, T.type, T.genre, T.runtime, T.contentRating]
      .filter(Boolean).join(' · ');
    document.getElementById('titleFacts').textContent = facts;

    scoreNumEl.textContent = BASE_SCORE.toFixed(1);
    scoreCountEl.textContent = BASE_VOTES.toLocaleString('en-US');

    document.getElementById('synopsisText').textContent = T.synopsis;
    document.getElementById('creditLine').innerHTML =
      (T.director ? '<b>Director</b> ' + escapeHtml(T.director) + '<br>' : '') +
      (T.writers ? '<b>Writers</b> ' + escapeHtml(T.writers) + '<br>' : '') +
      (T.genre ? '<b>Genre</b> ' + escapeHtml(T.genre) : '');

    const castScroll = document.getElementById('castScroll');
    castScroll.innerHTML = T.cast.map(function (c) {
      const initials = c.name.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);
      return '<div class="profile-card">' +
        '<div class="profile-photo ' + c.cls + '">' + initials + '</div>' +
        '<div class="profile-name">' + c.name + '</div>' +
        '<div class="profile-role">Actor</div>' +
      '</div>';
    }).join('');

    const galleryScroll = document.getElementById('galleryScroll');
    galleryScroll.innerHTML = [1,2,3,4,5,6].map(function () {
      return '<div class="gallery-thumb"></div>';
    }).join('');
  }

  const starButtons = [];
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.innerHTML = starSVG(false);
    b.dataset.val = i;
    b.addEventListener('click', function () {
      submitRating(i * 2, i);
    });
    starsWrap.appendChild(b);
    starButtons.push(b);
  }

  function paintStars(halfStars) {
    starButtons.forEach(function (el, idx) {
      el.classList.toggle('on', idx < halfStars);
    });
  }

  function updateReviewRatingPill() {
    reviewRatingValue.textContent = userRating > 0 ? (userRating + '/10') : '–/10';
  }

  async function submitRating(score10, halfStars) {
    userRating = score10;
    paintStars(halfStars);
    updateReviewRatingPill();
    statusEl.textContent = 'Saving... ' + score10 + '/10';

    if (!supabaseClient) {
      try { localStorage.setItem('chroma_rating_' + TITLE_NAME, String(score10)); } catch(e) {}
      statusEl.textContent = score10 + '/10';
      revealReviewForm();
      return;
    }

    try {
      const { error } = await supabaseClient
        .from('ratings')
        .upsert(
          { user_id: USER_ID, film_title: TITLE_NAME, score: score10, updated_at: new Date().toISOString() },
          { onConflict: 'user_id,film_title' }
        );
      if (error) throw error;
      statusEl.textContent = score10 + '/10';
      await refreshAggregate();
      revealReviewForm();
    } catch (e) {
      console.warn('Rating save failed:', e);
      statusEl.textContent = 'Failed to save';
    }
  }

  async function loadUserRating() {
    if (!supabaseClient) {
      try {
        const v = localStorage.getItem('chroma_rating_' + TITLE_NAME);
        if (v) {
          userRating = parseInt(v, 10);
          paintStars(Math.round(userRating / 2));
          statusEl.textContent = userRating + '/10';
          updateReviewRatingPill();
          revealReviewForm(true);
        }
      } catch(e) {}
      return;
    }
    try {
      const { data, error } = await supabaseClient
        .from('ratings')
        .select('score')
        .eq('user_id', USER_ID)
        .eq('film_title', TITLE_NAME)
        .maybeSingle();
      if (error) throw error;
      if (data && data.score) {
        userRating = data.score;
        paintStars(Math.round(userRating / 2));
        statusEl.textContent = userRating + '/10';
        updateReviewRatingPill();
        revealReviewForm(true);
      }
    } catch (e) { console.warn('Load user rating failed:', e); }
  }

  async function refreshAggregate() {
    if (!supabaseClient) return;
    try {
      const { data, error } = await supabaseClient
        .from('ratings')
        .select('score')
        .eq('film_title', TITLE_NAME);
      if (error) throw error;

      const userScores = (data || []).map(function(r){ return r.score || 0; });
      const userSum = userScores.reduce(function(a, b){ return a + b; }, 0);
      const userCount = userScores.length;

      const totalVotes = BASE_VOTES + userCount;
      const totalSum = BASE_SCORE * BASE_VOTES + userSum;
      const avg = totalSum / totalVotes;

      scoreNumEl.textContent = avg.toFixed(1);
      scoreCountEl.textContent = totalVotes.toLocaleString('en-US');
    } catch (e) { console.warn('Aggregate failed:', e); }
  }

  let reviewRevealed = false;

  function revealReviewForm(skipScroll) {
    if (reviewRevealed) return;
    reviewRevealed = true;
    reviewFormWrap.classList.add('revealed');

    if (!skipScroll) {
      setTimeout(function () {
        const y = reviewSection.getBoundingClientRect().top + window.pageYOffset - 80;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }, 350);
    }
  }

  let isSaved = false;

  function paintAddListBtn() {
    addListBtn.classList.toggle('active', isSaved);
    const span = addListBtn.querySelector('span');
    if (span) span.textContent = isSaved ? 'Added' : 'Add to List';
    const svg = addListBtn.querySelector('svg');
    if (svg) {
      svg.innerHTML = isSaved
        ? '<path d="M20 6L9 17l-5-5"/>'
        : '<path d="M12 5v14M5 12h14"/>';
    }
  }

  async function loadSavedState() {
    if (supabaseClient) {
      try {
        const { data, error } = await supabaseClient
          .from('saves')
          .select('film_title')
          .eq('user_id', USER_ID)
          .eq('film_title', TITLE_NAME)
          .maybeSingle();
        if (error) throw error;
        isSaved = !!data;
      } catch (e) { console.warn('Load save failed:', e); }
    } else {
      try {
        const list = JSON.parse(localStorage.getItem('chroma_saved') || '[]');
        isSaved = list.indexOf(TITLE_NAME) !== -1;
      } catch (e) {}
    }
    saveBtn.classList.toggle('active', isSaved);
    paintAddListBtn();
  }

  async function toggleSave() {
    isSaved = !isSaved;
    saveBtn.classList.toggle('active', isSaved);
    paintAddListBtn();

    if (!supabaseClient) {
      try {
        let list = JSON.parse(localStorage.getItem('chroma_saved') || '[]');
        if (isSaved) { if (list.indexOf(TITLE_NAME) === -1) list.push(TITLE_NAME); }
        else { list = list.filter(function(t) { return t !== TITLE_NAME; }); }
        localStorage.setItem('chroma_saved', JSON.stringify(list));
      } catch(e) {}
      return;
    }

    try {
      if (isSaved) {
        await supabaseClient.from('saves').upsert(
          { user_id: USER_ID, film_title: TITLE_NAME },
          { onConflict: 'user_id,film_title' }
        );
      } else {
        await supabaseClient.from('saves').delete()
          .eq('user_id', USER_ID).eq('film_title', TITLE_NAME);
      }
    } catch (e) { console.warn('Save toggle failed:', e); }
  }

  saveBtn.addEventListener('click', toggleSave);
  addListBtn.addEventListener('click', toggleSave);

  const videoModal = document.getElementById('videoModal');
  const modalVideo = document.getElementById('modalVideo');
  const playTrailerBtn = document.getElementById('playTrailerBtn');
  const videoModalClose = document.getElementById('videoModalClose');
  const heroVideo = document.getElementById('heroVideo');

  playTrailerBtn.addEventListener('click', function () {
    videoModal.classList.add('open');
    document.body.style.overflow = 'hidden';
    try { heroVideo.pause(); } catch(e) {}
    modalVideo.currentTime = 0;
    const p = modalVideo.play();
    if (p && p.catch) p.catch(function(){});
  });

  function closeVideoModal() {
    videoModal.classList.remove('open');
    document.body.style.overflow = '';
    try { modalVideo.pause(); } catch(e) {}
    try { heroVideo.play(); } catch(e) {}
  }
  videoModalClose.addEventListener('click', closeVideoModal);
  videoModal.addEventListener('click', function (e) {
    if (e.target === videoModal) closeVideoModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && videoModal.classList.contains('open')) closeVideoModal();
  });

  function reviewCardHTML(r) {
    const initials = (r.name || 'A').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
    const starCount = Math.round((r.stars || 0) / 2);
    let starsHtml = '';
    for (let i = 0; i < 5; i++) starsHtml += starSVG(i < starCount);
    const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' }) : '';
    return '<div class="review-card">' +
      '<div class="review-top">' +
        '<div class="review-avatar">' + escapeHtml(initials) + '</div>' +
        '<div>' +
          '<div class="review-name">' + escapeHtml(r.name || 'Anonymous') + '</div>' +
          '<div class="review-date">' + dateStr + '</div>' +
        '</div>' +
        '<div class="review-stars">' + starsHtml +
          '<span style="margin-left:4px;font-weight:700;color:#f5f5f2;">' + (r.stars || 0) + '/10</span></div>' +
      '</div>' +
      '<div class="review-text">' + escapeHtml(r.text || '') + '</div>' +
    '</div>';
  }

  async function loadReviews() {
    if (!supabaseClient) {
      reviewList.innerHTML = '<p class="review-empty">No reviews yet.</p>';
      return;
    }
    try {
      const { data, error } = await supabaseClient
        .from('reviews')
        .select('name, stars, text, created_at')
        .eq('film_title', TITLE_NAME)
        .order('created_at', { ascending: false });
      if (error) throw error;
      if (!data || data.length === 0) {
        reviewList.innerHTML = '<p class="review-empty">No reviews yet. Be the first!</p>';
        return;
      }
      reviewList.innerHTML = data.map(reviewCardHTML).join('');
    } catch (e) {
      console.warn('Load reviews failed:', e);
      reviewList.innerHTML = '<p class="review-empty">No reviews yet.</p>';
    }
  }

  reviewForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    reviewFormMsg.textContent = '';

    const name = reviewNameInput.value.trim();
    const text = reviewTextInput.value.trim();

    if (!name) { reviewFormMsg.textContent = 'Please enter your name.'; return; }
    if (!text) { reviewFormMsg.textContent = 'Please write your review.'; return; }
    if (userRating < 1) { reviewFormMsg.textContent = 'Please rate this title first.'; return; }

    reviewSubmit.disabled = true;
    reviewFormMsg.textContent = 'Sending...';

    if (!supabaseClient) {
      reviewFormMsg.textContent = 'Supabase is not configured.';
      reviewSubmit.disabled = false;
      return;
    }

    try {
      const { error } = await supabaseClient.from('reviews').insert({
        user_id: USER_ID,
        film_title: TITLE_NAME,
        name: name,
        text: text,
        stars: userRating,
        created_at: new Date().toISOString()
      });
      if (error) throw error;
      reviewFormMsg.textContent = 'Review submitted ✓';
      reviewForm.reset();
      loadReviews();
    } catch (e) {
      console.warn('Submit review failed:', e);
      reviewFormMsg.textContent = 'Failed to send. Please try again.';
    } finally {
      reviewSubmit.disabled = false;
    }
  });

  async function loadMoreLikeThis() {
    if (!supabaseClient) {
      similarScroll.innerHTML = '<p class="review-empty">Supabase not configured.</p>';
      return;
    }
    try {
      const { data, error } = await supabaseClient
        .from('titles')
        .select('title, genre, type, year, rating, poster, poster_num, page')
        .eq('genre', T.genre)
        .neq('title', TITLE_NAME)
        .order('rating', { ascending: false })
        .limit(6);
      if (error) throw error;

      if (!data || data.length === 0) {
        similarScroll.innerHTML = '<p class="review-empty">No similar titles in this genre yet.</p>';
        return;
      }

      similarScroll.innerHTML = data.map(function (s) {
        const posterFile = s.poster || ('poster' + (s.poster_num || 1) + '.png');
        return '<div class="card" data-href="' + escapeHtml(s.page || 'example.html') + '">' +
          '<div class="poster">' +
            '<img src="' + escapeHtml(posterFile) + '" alt="' + escapeHtml(s.title) + '" ' +
              'onerror="this.style.display=\'none\';">' +
            '<div class="label">' + escapeHtml(String(s.title).toUpperCase()) + '</div>' +
          '</div>' +
          '<div class="card-meta">' +
            '<div class="rating">' + starSVG(true) + Number(s.rating || 0).toFixed(1) + '</div>' +
            '<div class="card-title">' + escapeHtml(s.title) + '</div>' +
            '<div class="card-sub">' + escapeHtml(s.type) + ' · ' + s.year + '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      similarScroll.addEventListener('click', function (e) {
        const card = e.target.closest('.card');
        if (card && card.dataset.href) window.location.href = card.dataset.href;
      });
    } catch (e) {
      console.warn('Load More Like This failed:', e);
      similarScroll.innerHTML = '<p class="review-empty">Failed to load.</p>';
    }
  }

  async function init() {
    await loadTitle();
    loadUserRating();
    refreshAggregate();
    loadSavedState();
    loadReviews();
    loadMoreLikeThis();
  }

  init();

})();
</script>

</body>
</html>
