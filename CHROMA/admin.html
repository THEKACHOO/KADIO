<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHROMA — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a; color: #f5f5f2;
    font-family: 'Inter', sans-serif;
    padding: 20px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; gap: 12px;
  }
  .brand {
    font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700;
    color: #f2c94c; letter-spacing: 2px;
  }
  .brand small {
    color: #9a9a95; font-size: 11px; margin-left: 8px;
    letter-spacing: 0; font-family: 'Inter'; font-weight: 500;
  }
  .back-link { font-size: 12px; color: #9a9a95; text-decoration: none; }
  .back-link:hover { color: #f2c94c; }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; }
  .tab {
    padding: 8px 14px; border-radius: 999px;
    background: #141414; border: 1px solid #2a2a2a;
    font-size: 12px; font-weight: 700; color: #c9c9c4;
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
    font-family: inherit;
  }
  .tab.active { background: #f2c94c; color: #0a0a0a; border-color: #f2c94c; }

  .card {
    background: #101010; border: 1px solid #2a2a2a;
    border-radius: 12px; padding: 18px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 14px; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2::before {
    content: ''; width: 4px; height: 14px;
    background: #f2c94c; border-radius: 2px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 11px; color: #9a9a95;
    margin-bottom: 4px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field input, .field select, .field textarea {
    width: 100%; background: #0a0a0a;
    border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 9px 12px; color: #f5f5f2;
    font-family: 'Inter', sans-serif; font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  .field input[type="file"] {
    padding: 7px 10px; cursor: pointer;
    font-size: 12px;
  }
  .field input[type="file"]::file-selector-button {
    background: #1b1b1b; border: 1px solid #2a2a2a;
    color: #f5f5f2; font-family: inherit;
    padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 600;
    margin-right: 10px;
    transition: border-color .15s;
  }
  .field input[type="file"]::file-selector-button:hover {
    border-color: #f2c94c;
  }
  .field input::placeholder, .field textarea::placeholder {
    color: #555;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: #f2c94c;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field select { cursor: pointer; }

  /* ---------- POSTER PREVIEW ---------- */
  .poster-preview {
    display: none;
    margin-top: 12px;
    padding: 10px;
    background: #0a0a0a;
    border: 1px dashed #2a2a2a;
    border-radius: 10px;
    align-items: center;
    gap: 12px;
  }
  .poster-preview.show { display: flex; }
  .poster-preview img {
    width: 90px; height: 130px;
    object-fit: cover; border-radius: 8px;
    border: 1px solid #2a2a2a;
    background: #141414;
    flex-shrink: 0;
  }
  .poster-preview .info {
    flex: 1; min-width: 0;
    font-size: 11px; color: #9a9a95;
    line-height: 1.5;
  }
  .poster-preview .info strong {
    display: block; color: #f5f5f2;
    font-size: 12px; margin-bottom: 3px;
    word-break: break-all;
  }
  .poster-preview .remove-btn {
    background: rgba(220,60,60,0.1);
    border: 1px solid rgba(220,60,60,0.4);
    color: #ff7a7a;
    font-size: 11px; font-weight: 600;
    padding: 5px 10px; border-radius: 6px;
    cursor: pointer; font-family: inherit;
    transition: background .15s;
    align-self: flex-start;
    flex-shrink: 0;
  }
  .poster-preview .remove-btn:hover {
    background: rgba(220,60,60,0.2);
  }

  /* ---------- PROGRESS BAR ---------- */
  .progress-bar {
    width: 100%; height: 3px;
    background: #1b1b1b; border-radius: 2px;
    overflow: hidden; margin-top: 8px;
    display: none;
  }
  .progress-bar.show { display: block; }
  .progress-bar .fill {
    height: 100%; background: #f2c94c;
    width: 0%; transition: width .2s;
  }

  .check-row {
    display: flex; gap: 16px; margin: 12px 0;
    flex-wrap: wrap;
  }
  .check-row label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #c9c9c4; font-weight: 600;
    cursor: pointer;
  }
  .check-row input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: #f2c94c;
    cursor: pointer;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    border: 1px solid #2a2a2a; background: #141414; color: #f5f5f2;
    font-family: inherit; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: #1b1b1b; }
  .btn-primary { background: #f2c94c; color: #0a0a0a; border-color: #f2c94c; }
  .btn-primary:hover { background: #e0b83f; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  .msg { font-size: 12px; margin-top: 10px; min-height: 16px; color: #f2c94c; }
  .msg.error { color: #ff7a7a; }
  .msg.success { color: #7aff9e; }

  .list-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid #2a2a2a;
  }
  .list-row:last-child { border-bottom: none; padding-bottom: 0; }
  .list-thumb {
    width: 42px; height: 58px; border-radius: 6px;
    background: #1a1a1a; border: 1px solid #2a2a2a;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Archivo Black'; font-size: 10px; color: #6b6b66;
    overflow: hidden; position: relative;
  }
  .list-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .list-info { flex: 1; min-width: 0; }
  .list-title { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
  .list-sub { font-size: 11px; color: #9a9a95; }
  .list-badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .badge {
    font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 3px;
    letter-spacing: 0.3px;
  }
  .badge.new { background: rgba(122,255,158,0.15); color: #7aff9e; border: 1px solid rgba(122,255,158,0.35); }
  .badge.trend { background: rgba(242,201,76,0.15); color: #f2c94c; border: 1px solid rgba(242,201,76,0.35); }
  .badge.watch { background: rgba(122,180,255,0.15); color: #7ab4ff; border: 1px solid rgba(122,180,255,0.35); }
  .badge.box { background: rgba(255,140,200,0.15); color: #ff8cc8; border: 1px solid rgba(255,140,200,0.35); }
  .badge.nopage { background: rgba(255,122,122,0.12); color: #ff7a7a; border: 1px solid rgba(255,122,122,0.3); }

  .list-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .list-actions button {
    padding: 6px 12px; font-size: 11px; border-radius: 6px;
    border: 1px solid #2a2a2a; background: #141414; color: #f5f5f2;
    cursor: pointer; font-weight: 600; font-family: inherit;
    transition: border-color .15s, background .15s;
  }
  .list-actions button.edit { border-color: rgba(242,201,76,0.4); color: #f2c94c; }
  .list-actions button.edit:hover { background: rgba(242,201,76,0.08); }
  .list-actions button.del { border-color: rgba(220,60,60,0.4); color: #ff7a7a; }
  .list-actions button.del:hover { background: rgba(220,60,60,0.08); }

  .empty { color: #9a9a95; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<div class="container">

  <div class="top">
    <div class="brand">CHROMA<small>Admin Panel</small></div>
    <a href="index.html" class="back-link">← Back to site</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="list">All Titles</button>
    <button class="tab" data-tab="form">Add / Edit</button>
  </div>

  <div id="tabList">
    <div class="card">
      <h2>All Titles (<span id="listCount">0</span>)</h2>
      <div id="listContainer">
        <p class="empty">Loading...</p>
      </div>
    </div>
  </div>

  <div id="tabForm" style="display:none;">
    <div class="card">
      <h2 id="formTitle">Add New Title</h2>
      <input type="hidden" id="f_id">

      <div class="grid-2">
        <div class="field">
          <label for="f_title">Title *</label>
          <input type="text" id="f_title" placeholder="Example 9" required>
        </div>
        <div class="field">
          <label for="f_slug">Slug * (auto dari title)</label>
          <input type="text" id="f_slug" placeholder="example-9" required>
        </div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label for="f_genre">Genre *</label>
          <input type="text" id="f_genre" placeholder="Drama" required>
        </div>
        <div class="field">
          <label for="f_type">Type *</label>
          <select id="f_type" required>
            <option value="Film">Film</option>
            <option value="Movie">Movie</option>
            <option value="Series">Series</option>
            <option value="Theater">Theater</option>
            <option value="Short Movie">Short Movie</option>
          </select>
        </div>
        <div class="field">
          <label for="f_year">Year *</label>
          <input type="number" id="f_year" min="1900" max="2100" placeholder="2026" required>
        </div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label for="f_rating">Baseline Rating (0–10)</label>
          <input type="number" id="f_rating" min="0" max="10" step="0.1" placeholder="7.6">
        </div>
        <div class="field">
          <label for="f_votes">Baseline Votes</label>
          <input type="number" id="f_votes" min="0" placeholder="500">
        </div>
        <div class="field">
          <label for="f_runtime">Runtime</label>
          <input type="text" id="f_runtime" placeholder="2h 18m / 48m/ep">
        </div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label for="f_content_rating">Content Rating</label>
          <input type="text" id="f_content_rating" placeholder="13+ / 16+ / 18+">
        </div>
        <div class="field">
          <label for="f_tag">Tag</label>
          <input type="text" id="f_tag" placeholder="NEW SEASON / IN THEATERS">
        </div>
        <div class="field">
          <label for="f_page">Page (HTML file)</label>
          <input type="text" id="f_page" placeholder="Example9.html">
        </div>
      </div>

      <div class="field">
        <label for="f_synopsis">Synopsis</label>
        <textarea id="f_synopsis" placeholder="A man's life unravels..."></textarea>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="f_director">Director</label>
          <input type="text" id="f_director" placeholder="Placeholder Director">
        </div>
        <div class="field">
          <label for="f_writers">Writers (pisah pakai koma)</label>
          <input type="text" id="f_writers" placeholder="Writer A, Writer B, Writer C">
        </div>
      </div>

      <!-- ===== POSTER UPLOAD ===== -->
      <div class="field">
        <label for="f_poster_file">Poster Image — Potrait 7:10 (rekomendasi 800×1140px, max 5MB)</label>
        <input type="file" id="f_poster_file" accept="image/jpeg,image/jpg,image/png,image/webp">
        <input type="hidden" id="f_poster">
        <div class="progress-bar" id="uploadProgress">
          <div class="fill" id="uploadProgressFill"></div>
        </div>
        <div class="poster-preview" id="posterPreviewWrap">
          <img id="posterPreview" alt="Poster preview">
          <div class="info">
            <strong id="posterInfoName">Poster</strong>
            <span id="posterInfoStatus">Current poster</span>
          </div>
          <button type="button" class="remove-btn" id="removePosterBtn">Remove</button>
        </div>
      </div>

      <input type="hidden" id="f_cls" value="g1">

      <div class="check-row">
        <label><input type="checkbox" id="f_is_new"> Show in "New &amp; Now Showing"</label>
        <label><input type="checkbox" id="f_is_trending"> Show in "Trending This Week"</label>
        <label><input type="checkbox" id="f_is_what_to_watch"> Show in "What to Watch"</label>
        <label><input type="checkbox" id="f_is_top_box_office"> Show in "Top Box Office"</label>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">Save Title</button>
        <button class="btn" id="cancelBtn" style="display:none;">Cancel Edit</button>
      </div>
      <div class="msg" id="formMsg"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {

  const SUPABASE_URL = 'https://euepdfhxyuomaqkpnrit.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1ZXBkZmh4eXVvbWFxa3Bucml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTg3ODUsImV4cCI6MjEwNTA3NDc4NX0.N4bvYVFxxbXAk0XcBgaooC7SiSopAZrgXRCtw9oJc84';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const MAX_POSTER_BYTES = 5 * 1024 * 1024; // 5MB

  /* ---------- Tab switching ---------- */
  function showTab(name) {
    document.querySelectorAll('.tab').forEach(function (x) {
      x.classList.toggle('active', x.dataset.tab === name);
    });
    document.getElementById('tabList').style.display = name === 'list' ? 'block' : 'none';
    document.getElementById('tabForm').style.display = name === 'form' ? 'block' : 'none';
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { showTab(t.dataset.tab); });
  });

  /* ---------- Field refs ---------- */
  const F = {
    id:                document.getElementById('f_id'),
    title:             document.getElementById('f_title'),
    slug:              document.getElementById('f_slug'),
    genre:             document.getElementById('f_genre'),
    type:              document.getElementById('f_type'),
    year:              document.getElementById('f_year'),
    rating:            document.getElementById('f_rating'),
    votes:             document.getElementById('f_votes'),
    runtime:           document.getElementById('f_runtime'),
    content_rating:    document.getElementById('f_content_rating'),
    tag:               document.getElementById('f_tag'),
    page:              document.getElementById('f_page'),
    synopsis:          document.getElementById('f_synopsis'),
    director:          document.getElementById('f_director'),
    writers:           document.getElementById('f_writers'),
    poster:            document.getElementById('f_poster'),
    poster_file:       document.getElementById('f_poster_file'),
    cls:               document.getElementById('f_cls'),
    is_new:            document.getElementById('f_is_new'),
    is_trending:       document.getElementById('f_is_trending'),
    is_what_to_watch:  document.getElementById('f_is_what_to_watch'),
    is_top_box_office: document.getElementById('f_is_top_box_office'),
    previewWrap:       document.getElementById('posterPreviewWrap'),
    previewImg:        document.getElementById('posterPreview'),
    previewName:       document.getElementById('posterInfoName'),
    previewStatus:     document.getElementById('posterInfoStatus'),
    removePoster:      document.getElementById('removePosterBtn'),
    progressWrap:      document.getElementById('uploadProgress'),
    progressFill:      document.getElementById('uploadProgressFill')
  };

  const formMsg = document.getElementById('formMsg');
  const formTitle = document.getElementById('formTitle');
  const cancelBtn = document.getElementById('cancelBtn');
  const saveBtn = document.getElementById('saveBtn');
  const listContainer = document.getElementById('listContainer');
  const listCount = document.getElementById('listCount');

  /* ---------- Utility ---------- */
  function autoSlug(str) {
    return str.toLowerCase().trim()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function humanSize(bytes) {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function posterSrc(t) {
    if (t.poster) return t.poster;
    if (t.poster_num != null) return 'poster' + t.poster_num + '.png';
    return 'poster1.png';
  }

  /* ---------- Auto slug ---------- */
  F.title.addEventListener('input', function () {
    if (!F.id.value) F.slug.value = autoSlug(F.title.value);
  });

  /* ---------- Poster preview saat pilih file ---------- */
  F.poster_file.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      formMsg.textContent = 'File harus berupa gambar (JPG/PNG/WebP).';
      formMsg.className = 'msg error';
      F.poster_file.value = '';
      return;
    }
    if (file.size > MAX_POSTER_BYTES) {
      formMsg.textContent = 'Ukuran poster terlalu besar (max 5MB). File kamu: ' + humanSize(file.size);
      formMsg.className = 'msg error';
      F.poster_file.value = '';
      return;
    }

    formMsg.textContent = '';
    formMsg.className = 'msg';

    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        const ratio = img.width / img.height;
        const isPortrait = ratio < 1;
        F.previewImg.src = ev.target.result;
        F.previewName.textContent = file.name;
        F.previewStatus.textContent = img.width + '×' + img.height + ' · ' +
          humanSize(file.size) +
          (isPortrait ? '' : ' · ⚠️ bukan potrait');
        F.previewWrap.classList.add('show');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  /* ---------- Remove poster ---------- */
  F.removePoster.addEventListener('click', function () {
    F.poster_file.value = '';
    F.poster.value = '';
    F.previewWrap.classList.remove('show');
    F.previewImg.src = '';
    formMsg.textContent = 'Poster akan dihapus saat Save.';
    formMsg.className = 'msg';
  });

  /* ---------- Upload ke Supabase Storage ---------- */
  async function uploadPoster(file) {
    const ext = (file.name.split('.').pop() || 'png').toLowerCase();
    const fileName = 'poster_' + Date.now() + '_' +
                     Math.random().toString(36).slice(2, 8) + '.' + ext;

    F.progressWrap.classList.add('show');
    F.progressFill.style.width = '20%';

    const { data, error } = await sb.storage
      .from('posters')
      .upload(fileName, file, {
        cacheControl: '3600',
        upsert: false,
        contentType: file.type
      });

    F.progressFill.style.width = '80%';

    if (error) {
      F.progressWrap.classList.remove('show');
      F.progressFill.style.width = '0%';
      throw error;
    }

    const { data: urlData } = sb.storage
      .from('posters')
      .getPublicUrl(fileName);

    F.progressFill.style.width = '100%';
    setTimeout(function () {
      F.progressWrap.classList.remove('show');
      F.progressFill.style.width = '0%';
    }, 500);

    return urlData.publicUrl;
  }

  /* ---------- Ambil path dari URL ---------- */
  function posterPathFromUrl(url) {
    if (!url) return null;
    const marker = '/storage/v1/object/public/posters/';
    const idx = url.indexOf(marker);
    if (idx === -1) return null;
    return decodeURIComponent(url.substring(idx + marker.length));
  }

  async function deleteOldPoster(oldUrl) {
    const path = posterPathFromUrl(oldUrl);
    if (!path) return;
    try {
      await sb.storage.from('posters').remove([path]);
    } catch (e) {
      console.warn('Delete old poster failed:', e);
    }
  }

  /* ---------- Load list ---------- */
  async function loadTitles() {
    listContainer.innerHTML = '<p class="empty">Loading...</p>';
    try {
      const { data, error } = await sb
        .from('titles')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;

      listCount.textContent = data.length;

      if (data.length === 0) {
        listContainer.innerHTML = '<p class="empty">No titles yet. Go to "Add / Edit" to add one.</p>';
        return;
      }

      listContainer.innerHTML = data.map(function (t) {
        const badges = [];
        if (t.is_new) badges.push('<span class="badge new">NEW</span>');
        if (t.is_trending) badges.push('<span class="badge trend">TRENDING</span>');
        if (t.is_what_to_watch) badges.push('<span class="badge watch">WHAT TO WATCH</span>');
        if (t.is_top_box_office) badges.push('<span class="badge box">TOP BOX OFFICE</span>');
        if (!t.page || t.page === 'example.html' || t.page === '#') {
          badges.push('<span class="badge nopage">NO PAGE</span>');
        }
        const src = posterSrc(t);
        return '<div class="list-row">' +
          '<div class="list-thumb">' +
            '<img src="' + escapeHtml(src) + '" alt="" ' +
              'onerror="this.style.display=\'none\'; this.parentElement.textContent=\'PNG\';">' +
          '</div>' +
          '<div class="list-info">' +
            '<div class="list-title">' + escapeHtml(t.title) + '</div>' +
            '<div class="list-sub">' +
              escapeHtml(t.genre) + ' · ' + escapeHtml(t.type) + ' · ' + t.year +
              ' · ★ ' + Number(t.rating || 0).toFixed(1) +
              ' · ' + (t.votes || 0) + ' votes' +
            '</div>' +
            (badges.length ? '<div class="list-badges">' + badges.join('') + '</div>' : '') +
          '</div>' +
          '<div class="list-actions">' +
            '<button class="edit" data-id="' + t.id + '">Edit</button>' +
            '<button class="del" data-id="' + t.id + '">Delete</button>' +
          '</div>' +
        '</div>';
      }).join('');

      listContainer.querySelectorAll('button.edit').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const row = data.find(function (x) { return x.id === btn.dataset.id; });
          if (row) fillForm(row);
        });
      });

      listContainer.querySelectorAll('button.del').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          if (!confirm('Delete this title? Cannot be undone.')) return;
          const row = data.find(function (x) { return x.id === btn.dataset.id; });
          try {
            if (row && row.poster) {
              await deleteOldPoster(row.poster);
            }
            const { error } = await sb.from('titles').delete().eq('id', btn.dataset.id);
            if (error) throw error;
            loadTitles();
          } catch (e) { alert('Delete failed: ' + e.message); }
        });
      });

    } catch (e) {
      console.error(e);
      listContainer.innerHTML = '<p class="empty" style="color:#ff7a7a;">Failed: ' + escapeHtml(e.message) + '</p>';
    }
  }

  /* ---------- Fill form (edit) ---------- */
  function fillForm(t) {
    F.id.value = t.id || '';
    F.title.value = t.title || '';
    F.slug.value = t.slug || '';
    F.genre.value = t.genre || '';
    F.type.value = t.type || 'Film';
    F.year.value = t.year || '';
    F.rating.value = t.rating != null ? t.rating : '';
    F.votes.value = t.votes != null ? t.votes : '';
    F.runtime.value = t.runtime || '';
    F.content_rating.value = t.content_rating || '';
    F.tag.value = t.tag || '';
    F.page.value = t.page || '';
    F.synopsis.value = t.synopsis || '';
    F.director.value = t.director || '';
    F.writers.value = t.writers || '';
    F.is_new.checked = !!t.is_new;
    F.is_trending.checked = !!t.is_trending;
    F.is_what_to_watch.checked = !!t.is_what_to_watch;
    F.is_top_box_office.checked = !!t.is_top_box_office;

    const posterVal = t.poster || (t.poster_num != null ? 'poster' + t.poster_num + '.png' : '');
    F.poster.value = posterVal;
    F.poster_file.value = '';

    if (posterVal) {
      F.previewImg.src = posterVal;
      F.previewName.textContent = posterVal.split('/').pop() || posterVal;
      F.previewStatus.textContent = 'Current poster (klik input file untuk ganti)';
      F.previewWrap.classList.add('show');
    } else {
      F.previewWrap.classList.remove('show');
      F.previewImg.src = '';
    }

    formTitle.textContent = 'Edit Title — ' + t.title;
    cancelBtn.style.display = 'inline-flex';
    formMsg.textContent = '';
    formMsg.className = 'msg';
    showTab('form');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- Reset form ---------- */
  function resetForm() {
    F.id.value = '';
    F.title.value = '';
    F.slug.value = '';
    F.genre.value = '';
    F.type.value = 'Film';
    F.year.value = '';
    F.rating.value = '';
    F.votes.value = '';
    F.runtime.value = '';
    F.content_rating.value = '';
    F.tag.value = '';
    F.page.value = '';
    F.synopsis.value = '';
    F.director.value = '';
    F.writers.value = '';
    F.poster.value = '';
    F.poster_file.value = '';
    F.is_new.checked = false;
    F.is_trending.checked = false;
    F.is_what_to_watch.checked = false;
    F.is_top_box_office.checked = false;

    F.previewWrap.classList.remove('show');
    F.previewImg.src = '';
    F.previewName.textContent = '';
    F.previewStatus.textContent = '';

    formTitle.textContent = 'Add New Title';
    cancelBtn.style.display = 'none';
    formMsg.textContent = '';
    formMsg.className = 'msg';
  }

  cancelBtn.addEventListener('click', function () {
    resetForm();
    showTab('list');
  });

  /* ---------- SAVE ---------- */
  saveBtn.addEventListener('click', async function () {
    formMsg.textContent = '';
    formMsg.className = 'msg';

    if (!F.title.value.trim()) { formMsg.textContent = 'Title is required.'; formMsg.classList.add('error'); return; }
    if (!F.slug.value.trim())  { formMsg.textContent = 'Slug is required.'; formMsg.classList.add('error'); return; }
    if (!F.genre.value.trim()) { formMsg.textContent = 'Genre is required.'; formMsg.classList.add('error'); return; }

    const fileInput = F.poster_file.files[0];
    const oldPosterUrl = F.poster.value.trim() || null;
    let posterUrl = oldPosterUrl;

    saveBtn.disabled = true;
    formMsg.textContent = 'Saving...';

    try {
      if (fileInput) {
        formMsg.textContent = 'Uploading poster...';
        posterUrl = await uploadPoster(fileInput);
      }

      const payload = {
        title:              F.title.value.trim(),
        slug:               F.slug.value.trim(),
        genre:              F.genre.value.trim(),
        type:               F.type.value,
        year:               F.year.value ? parseInt(F.year.value, 10) : null,
        rating:             F.rating.value ? parseFloat(F.rating.value) : null,
        votes:              F.votes.value ? parseInt(F.votes.value, 10) : null,
        runtime:            F.runtime.value.trim() || null,
        content_rating:     F.content_rating.value.trim() || null,
        tag:                F.tag.value.trim() || null,
        page:               F.page.value.trim() || null,
        synopsis:           F.synopsis.value.trim() || null,
        director:           F.director.value.trim() || null,
        writers:            F.writers.value.trim() || null,
        poster:             posterUrl,
        cls:                'g1',
        is_new:             F.is_new.checked,
        is_trending:        F.is_trending.checked,
        is_what_to_watch:   F.is_what_to_watch.checked,
        is_top_box_office:  F.is_top_box_office.checked,
        updated_at:         new Date().toISOString()
      };

      if (payload.rating != null && (payload.rating < 0 || payload.rating > 10)) {
        throw new Error('Rating must be 0–10.');
      }

      if (F.id.value) {
        if (fileInput && oldPosterUrl && oldPosterUrl !== posterUrl) {
          await deleteOldPoster(oldPosterUrl);
        }
        if (!fileInput && !posterUrl && oldPosterUrl) {
          await deleteOldPoster(oldPosterUrl);
        }
        const { error } = await sb.from('titles').update(payload).eq('id', F.id.value);
        if (error) throw error;
        formMsg.textContent = 'Updated ✓';
        formMsg.classList.add('success');
      } else {
        const { error } = await sb.from('titles').insert(payload);
        if (error) throw error;
        formMsg.textContent = 'Created ✓';
        formMsg.classList.add('success');
      }

      resetForm();
      await loadTitles();
      setTimeout(function () { showTab('list'); }, 500);
    } catch (e) {
      console.error(e);
      formMsg.textContent = 'Failed: ' + e.message;
      formMsg.classList.add('error');
    } finally {
      saveBtn.disabled = false;
    }
  });

  /* ---------- Init ---------- */
  resetForm();
  loadTitles();

})();
</script>
</body>
</html>
