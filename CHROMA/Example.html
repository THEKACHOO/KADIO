    {
      title: "Example 6", genre: "Fantasy", type: "Film", year: 2025, rating: 7.0, votes: "11,050",
      poster: 6, cls: "g7", runtime: "2h 05m", contentRating: "13+", tag: "FESTIVAL PICK",
      synopsis: "A placeholder synopsis: an apprentice cartographer discovers her ink can redraw the borders of the kingdom — and someone is willing to kill for the pen.",
      director: "Placeholder Director", writers: "Placeholder Writer",
      cast: [ {name:"Cast Seventeen",cls:"p3"}, {name:"Cast Eighteen",cls:"p1"} ],
      similar: [4,3,7]
    },
    {
      title: "Example 7", genre: "Sci-Fi", type: "Film", year: 2026, rating: 8.6, votes: "31,200",
      poster: 7, cls: "g3", runtime: "2h 31m", contentRating: "16+", tag: "CRITICS' PICK",
      synopsis: "A placeholder synopsis: when a signal from beyond the solar system starts repeating in perfect sync with her own heartbeat, an engineer has to decide who else to tell.",
      director: "Placeholder Director", writers: "Placeholder Writer, Placeholder Writer",
      cast: [ {name:"Cast Nineteen",cls:"p5"}, {name:"Cast Twenty",cls:"p2"}, {name:"Cast One",cls:"p1"} ],
      similar: [2,5,0]
    },
    {
      title: "Example 8", genre: "Drama", type: "Series", year: 2026, rating: 7.2, votes: "6,830",
      poster: 8, cls: "g5", runtime: "50m/ep", contentRating: "16+", tag: "NEW SEASON",
      synopsis: "A placeholder synopsis: three former bandmates reunite for one last show, and old setlists start dredging up everything they never said.",
      director: "Placeholder Director", writers: "Placeholder Writer",
      cast: [ {name:"Cast Two",cls:"p2"}, {name:"Cast Nine",cls:"p4"} ],
      similar: [1,3,5]
    }
  ];

  const REVIEWS = [
    { name: "A. Prasetyo", initials: "AP", cls: "p1", stars: 9, date: "2 days ago",
      text: "Placeholder review: the pacing dips in the middle stretch but the final act more than earns its runtime. Strong lead performance carries the quieter scenes." },
    { name: "M. Wulandari", initials: "MW", cls: "p3", stars: 7, date: "1 week ago",
      text: "Placeholder review: solid production values and a genuinely surprising turn around the halfway mark, though a couple of side characters feel underwritten." },
    { name: "R. Hutagalung", initials: "RH", cls: "p4", stars: 10, date: "2 weeks ago",
      text: "Placeholder review: one of the better entries in the genre this year — the sound design alone is worth watching this on a proper setup." }
  ];

  function starSVG(filled) {
    return filled
      ? '<svg viewBox="0 0 24 24" class="star-filled"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/></svg>';
  }

  /* ---------- RESOLVE WHICH TITLE TO SHOW ---------- */
  let selected = null;
  try {
    const raw = sessionStorage.getItem('chroma_selected');
    if (raw) selected = JSON.parse(raw);
  } catch (e) {}

  let t = TITLES.find(function (x) { return x.title.toLowerCase() === String(selected).toLowerCase(); });
  if (!t) t = TITLES[2];

  /* ---------- RENDER HERO ---------- */
  document.title = t.title + ' — CHROMA';
  document.getElementById('backdrop').classList.add(t.cls);
  document.getElementById('posterLg').classList.add(t.cls);
  document.getElementById('posterLg').innerHTML = '<img src="poster' + t.poster + '.png" alt="' + t.title + '" onerror="this.style.display=\'none\';">';
  document.getElementById('kickerTag').textContent = t.tag;
  document.getElementById('titleName').textContent = t.title;
  document.getElementById('titleFacts').textContent = t.year + ' · ' + t.type + ' · ' + t.genre + ' · ' + t.runtime + ' · ' + t.contentRating;
  document.getElementById('scoreNum').textContent = t.rating.toFixed(1);
  document.getElementById('scoreCount').textContent = t.votes;
  document.getElementById('synopsisText').textContent = t.synopsis;
  document.getElementById('creditLine').innerHTML = '<b>Director</b> ' + t.director + '<br><b>Writers</b> ' + t.writers;

  /* ---------- YOUR RATING (in-memory only) ---------- */
  const starsWrap = document.getElementById('yourRateStars');
  const statusEl = document.getElementById('yourRateStatus');
  let userRating = 0;
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.innerHTML = starSVG(false);
    b.dataset.val = i;
    b.addEventListener('click', function () {
      userRating = i;
      Array.from(starsWrap.children).forEach(function (el, idx) {
        el.classList.toggle('on', idx < i);
      });
      statusEl.textContent = 'You rated this ' + i + '/5';
    });
    starsWrap.appendChild(b);
  }

  /* ---------- SAVE BUTTON ---------- */
  document.getElementById('saveBtn').addEventListener('click', function () {
    this.classList.toggle('active');
  });
  document.getElementById('addListBtn').addEventListener('click', function () {
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.classList.add('active');
  });

  /* ---------- CAST ---------- */
  document.getElementById('castScroll').innerHTML = t.cast.map(function (c) {
    const initials = c.name.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);
    return '<div class="profile-card">' +
      '<div class="profile-photo ' + c.cls + '">' + initials + '</div>' +
      '<div class="profile-name">' + c.name + '</div>' +
      '<div class="profile-role">Actor</div>' +
    '</div>';
  }).join('');

  /* ---------- GALLERY (placeholder tiles) ---------- */
  const galleryClasses = ['g1','g2','g3','g4','g5','g6'];
  document.getElementById('galleryScroll').innerHTML = galleryClasses.map(function (c) {
    return '<div class="gallery-thumb ' + c + '"></div>';
  }).join('');

  /* ---------- REVIEWS ---------- */
  document.getElementById('reviewList').innerHTML = REVIEWS.map(function (r) {
    const starCount = Math.round(r.stars / 2);
    let starsHtml = '';
    for (let i = 0; i < 5; i++) starsHtml += starSVG(i < starCount);
    return '<div class="review-card">' +
      '<div class="review-top">' +
        '<div class="review-avatar ' + r.cls + '">' + r.initials + '</div>' +
        '<div>' +
          '<div class="review-name">' + r.name + '</div>' +
          '<div class="review-date">' + r.date + '</div>' +
        '</div>' +
        '<div class="review-stars">' + starsHtml + '<span style="margin-left:4px;font-weight:700;color:#f5f5f2;">' + r.stars + '/10</span></div>' +
      '</div>' +
      '<div class="review-text">' + r.text + '</div>' +
      '<div class="review-foot"><svg viewBox="0 0 24 24"><path d="M7 22V10M2 13v7a2 2 0 002 2h13.5a2 2 0 002-1.6l1.2-6A2 2 0 0018.7 12H14V6a2 2 0 00-2-2l-3 7H2z"/></svg>Helpful</div>' +
    '</div>';
  }).join('');

  /* ---------- SIMILAR / MORE LIKE THIS ---------- */
  function goToDetail(title) {
    try { sessionStorage.setItem('chroma_selected', JSON.stringify(title)); } catch (e) {}
    window.location.href = 'example.html';
    window.location.reload();
  }
  window.goToDetail = goToDetail;

  document.getElementById('similarScroll').innerHTML = t.similar.map(function (idx) {
    const s = TITLES[idx];
    return '<div class="card" onclick="goToDetail(\'' + s.title.replace(/'/g, "\\'") + '\')">' +
      '<div class="poster ' + s.cls + '">' +
        '<img src="poster' + s.poster + '.png" alt="' + s.title + '" onerror="this.style.display=\'none\';">' +
        '<div class="label">' + s.title.toUpperCase() + '</div>' +
      '</div>' +
      '<div class="card-meta">' +
        '<div class="rating">' + starSVG(true) + s.rating.toFixed(1) + '</div>' +
        '<div class="card-title">' + s.title + '</div>' +
        '<div class="card-sub">' + s.type + ' · ' + s.year + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

})();
</script>
