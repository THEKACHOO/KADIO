<body>

<header>
  <div class="header-inner">
    <button class="icon-btn" id="backBtn" aria-label="Back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <a href="index.html"><span class="logo-text">CHROMA</span></a>
    <div class="head-right">
      <button class="icon-btn save-btn" id="saveBtn" aria-label="Save to list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v16l-6-4-6 4V4z"/></svg>
      </button>
      <button class="icon-btn" aria-label="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- HERO / BACKDROP dengan VIDEO 16:9 -->
<div class="backdrop" id="backdrop">
  <video id="heroVideo"
    src="https://res.cloudinary.com/dt5yn0xqh/video/upload/vidssave.com_The_Frog___Official_Trailer___Netflix_ENG_SUB_720P.mp4"
    autoplay muted loop playsinline preload="auto"></video>
  <div class="backdrop-shade"></div>
</div>

<div class="title-block">
  <div class="title-row">
    <div class="poster-lg" id="posterLg"></div>
    <div class="title-meta-top">
      <span class="kicker-tag" id="kickerTag">NOW SHOWING</span>
      <div class="title-name" id="titleName">Loading...</div>
      <div class="title-facts" id="titleFacts">—</div>
    </div>
  </div>
</div>

<div class="info-body">
  <div class="rate-row">
    <div class="score-card">
      <div class="score-num" id="scoreNum">–</div>
      <div class="score-sub">out of 10<br><b id="scoreCount">0</b> ratings</div>
    </div>
    <div class="yourrate-card">
      <div class="yourrate-label">Rate</div>
      <div class="yourrate-stars" id="yourRateStars"></div>
      <div class="yourrate-status" id="yourRateStatus"></div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn btn-primary" id="playTrailerBtn">
      <svg viewBox="0 0 24 24" fill="#0a0a0a"><path d="M8 5v14l11-7z"/></svg>Play Trailer
    </button>
    <button class="btn btn-ghost" id="addListBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>Add to List</span>
    </button>
  </div>

  <div class="synopsis">
    <p id="synopsisText"></p>
    <div class="credit-line" id="creditLine"></div>
  </div>
</div>

<section class="block">
  <div class="section-head"><h2><span class="bar"></span>Cast &amp; Crew</h2></div>
  <div class="profile-scroll" id="castScroll"></div>
</section>

<section class="block">
  <div class="section-head"><h2><span class="bar"></span>Photos</h2></div>
  <div class="gallery-scroll" id="galleryScroll"></div>
  <div class="gallery-dots" id="galleryDots"></div>
</section>

<section class="block" id="reviewSection">
  <div class="section-head"><h2><span class="bar"></span>User Reviews</h2></div>
  <div class="review-list" id="reviewList"></div>

  <div class="review-form-wrap" id="reviewFormWrap">
    <form class="review-form" id="reviewForm">
      <h3>Write a review</h3>
      <div class="field">
        <label for="reviewName">Name</label>
        <input type="text" id="reviewName" maxlength="40" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="reviewText">Review</label>
        <textarea id="reviewText" maxlength="500" placeholder="Share your thoughts about this title..." required></textarea>
      </div>
      <div class="row">
        <div class="review-rating-pill" id="reviewRatingPill">
          <span>Your rating</span>
          <b id="reviewRatingValue">–/10</b>
        </div>
        <button type="submit" class="review-submit" id="reviewSubmit">Submit</button>
      </div>
      <div class="review-form-msg" id="reviewFormMsg"></div>
    </form>
  </div>
</section>

<section class="block">
  <div class="section-head"><h2><span class="bar"></span>More Like This</h2></div>
  <div class="card-scroll" id="similarScroll"></div>
</section>

<div class="foot-links">
  <div class="brand">CHROMA</div>
  <p>Cinema House for Reviews, Original Media &amp; Arts — your home for ratings, reviews, showtimes, and everything film and TV.</p>
</div>

<!-- VIDEO MODAL -->
<div class="video-modal" id="videoModal">
  <button class="video-modal-close" id="videoModalClose" aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <video id="modalVideo" controls playsinline preload="metadata"
    src="https://res.cloudinary.com/dt5yn0xqh/video/upload/vidssave.com_The_Frog___Official_Trailer___Netflix_ENG_SUB_720P.mp4"></video>
</div>

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</script>

</body>
</html>
